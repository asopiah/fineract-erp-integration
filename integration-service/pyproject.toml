[project]
name = "integration-service"
version = "1.0.0"
description = "Partner-facing integration between Apache Fineract and the ERP."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "SQLAlchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
    "mypy==1.14.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
integration_service = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "stack: needs the running docker compose stack (customized Fineract and Mock ERP)",
]
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "DTZ"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["integration_service"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Alembic revisions call SQLAlchemy dialect types that ship without annotations.
module = "integration_service.migrations.*"
disallow_untyped_calls = false
