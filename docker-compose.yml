# Local stack: PostgreSQL, customized Fineract, Mock ERP, Integration Service.
# Credentials below are local development defaults, not secrets.

name: fineract-erp

x-db-passwords: &db-passwords
  FINERACT_DB_PASSWORD: fineract
  MOCK_ERP_DB_PASSWORD: mock_erp
  INTEGRATION_DB_PASSWORD: integration

services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      <<: *db-passwords
    volumes:
      - ./docker/postgres/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
      - postgres-data:/var/lib/postgresql
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  fineract:
    image: ${FINERACT_IMAGE:-fineract-gl-sync:1.15.0}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
      FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://postgres:5432/fineract_tenants
      FINERACT_HIKARI_USERNAME: fineract
      FINERACT_HIKARI_PASSWORD: fineract
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: postgres
      FINERACT_DEFAULT_TENANTDB_PORT: "5432"
      FINERACT_DEFAULT_TENANTDB_UID: fineract
      FINERACT_DEFAULT_TENANTDB_PWD: fineract
      FINERACT_DEFAULT_TENANTDB_CONN_PARAMS: ""
      FINERACT_DEFAULT_TENANTDB_TIMEZONE: Africa/Kigali
      FINERACT_DEFAULT_TENANTDB_IDENTIFIER: default
      FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
      FINERACT_DEFAULT_TENANTDB_DESCRIPTION: Default Tenant
      FINERACT_DEFAULT_MASTER_PASSWORD: fineract
      FINERACT_NODE_ID: "1"
      # Plain HTTP inside the compose network; TLS termination is out of scope for this assessment.
      FINERACT_SERVER_SSL_ENABLED: "false"
      FINERACT_SERVER_PORT: "8080"
      JAVA_TOOL_OPTIONS: >-
        -Xmx1G -XX:+UseContainerSupport -XX:TieredStopAtLevel=1
        --add-exports=java.naming/com.sun.jndi.ldap=ALL-UNNAMED
        --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
        --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.security=ALL-UNNAMED
        --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.management/javax.management=ALL-UNNAMED
        --add-opens=java.naming/javax.naming=ALL-UNNAMED
    ports:
      - "${FINERACT_HOST_PORT:-58080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/fineract-provider/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  mock-erp:
    build: ./mock-erp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ERP_DATABASE_URL: postgresql+psycopg://mock_erp:mock_erp@postgres:5432/mock_erp
      ERP_API_TOKEN: ${ERP_API_TOKEN:-erp-local-token}
      # Simulations drive failures through PUT /_faults; keep this off anywhere but a test stack.
      ERP_FAULT_INJECTION_ENABLED: ${FAULT_INJECTION_ENABLED:-true}
    ports:
      - "${ERP_HOST_PORT:-58001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  integration-service:
    build: ./integration-service
    image: fineract-erp/integration-service:local
    # A crash (simulation J5) is followed by a restart; the startup recovery sweep finishes interrupted operations.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      fineract:
        condition: service_healthy
      mock-erp:
        condition: service_healthy
    environment:
      INTEGRATION_DATABASE_URL: postgresql+psycopg://integration:integration@postgres:5432/integration
      INTEGRATION_API_TOKEN: ${INTEGRATION_API_TOKEN:-integration-local-token}
      INTEGRATION_FINERACT_URL: http://fineract:8080/fineract-provider/api/v1
      INTEGRATION_FINERACT_USERNAME: integration_api
      INTEGRATION_FINERACT_PASSWORD: ${FINERACT_API_PASSWORD:-Integration#2026}
      INTEGRATION_ERP_URL: http://mock-erp:8000
      INTEGRATION_ERP_API_TOKEN: ${ERP_API_TOKEN:-erp-local-token}
      INTEGRATION_LEASE_SECONDS: "20"
      INTEGRATION_FAULT_INJECTION_ENABLED: ${FAULT_INJECTION_ENABLED:-true}
    ports:
      - "${INTEGRATION_HOST_PORT:-58090}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot: configures the empty Fineract (office, currency, role, user, GL sync, loan product). Idempotent.
  bootstrap:
    image: fineract-erp/integration-service:local
    command: ["python", "-m", "integration_service.bootstrap"]
    restart: "no"
    depends_on:
      integration-service:
        condition: service_healthy
    environment:
      BOOTSTRAP_FINERACT_URL: http://fineract:8080/fineract-provider/api/v1
      BOOTSTRAP_API_PASSWORD: ${FINERACT_API_PASSWORD:-Integration#2026}
      BOOTSTRAP_INTEGRATION_URL: http://integration-service:8000
      BOOTSTRAP_INTEGRATION_API_TOKEN: ${INTEGRATION_API_TOKEN:-integration-local-token}

volumes:
  postgres-data:
